name: Verify pinned Git source tree semgrep
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/semgrep/semgrep.git
      upstream_sha: 06d9993409f6698f78f6956cd39d968e7f4d7b6a
      audit_slug: semgrep
